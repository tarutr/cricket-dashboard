<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>cricdb — cricket stats explorer</title>
<link rel="preload" href="/vendor/fonts/bricolage-grotesque-variable.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="/vendor/fonts/inter-variable.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="/styles.css" />
<script src="/vendor/chartjs/chart.umd.min.js" defer></script>
</head>
<body>
  <div id="player-popup-host"></div>

  <!-- Filters popup (F1a): the single home for EVERY filter (replaces the old
       on-page scope strip + right-side drawer). Static shell so main.js's
       module-level lookup for #filter-bar resolves at
       load time; opened via openFiltersPopup(), closed via ×/backdrop/Escape.
       Closing NEVER runs a query — only the footer "Search" button does. Two
       collapsible sections: Search Conditions + Advanced Filters (owner 1B-2 —
       the old "Player" section folded into Advanced Filters as condition types). -->
  <div class="filters-popup" id="filters-popup" data-role="filters-popup" hidden>
    <div class="filters-popup__backdrop" data-role="fpop-backdrop"></div>
    <div class="filters-popup__panel" role="dialog" aria-modal="true" aria-label="Filters" tabindex="-1" data-role="fpop-panel">
      <div class="filters-popup__header">
        <h2 class="filters-popup__title">Filters</h2>
        <button type="button" class="filters-popup__close" data-role="fpop-close" aria-label="Close">&times;</button>
      </div>

      <div class="filters-popup__body">
        <!-- Section 1: Search Conditions — src/filters.js populates #filter-bar
             with Gender · Discipline · Format · Date range · Team type (ROUND 3
             task 1: Gender and Discipline are now compact <select>s rendered by
             filters.js, so there's no static Discipline markup here any more). -->
        <!-- Minimise/maximise fires ONLY from the chevron BUTTON, never from the
             header row (owner fix, polish): with a filter dropdown open you
             instinctively click outside it to dismiss it, and that click used to
             land on the whole-row header button and collapse the section. The
             header is now plain text; the chevron is the one focusable control
             and carries aria-expanded/aria-controls (main.js finds it by
             data-role, unchanged). -->
        <section class="filters-popup__section">
          <div class="filters-popup__section-header">
            <span class="filters-popup__section-name">Search Conditions</span>
            <button type="button" class="filters-popup__chevron" data-role="fpop-section-toggle" aria-expanded="true" aria-controls="fpop-body-conditions" aria-label="Show or hide Search Conditions"><span aria-hidden="true">▾</span></button>
          </div>
          <div class="filters-popup__section-body" id="fpop-body-conditions">
            <div class="filter-bar" id="filter-bar"></div>
          </div>
        </section>

        <!-- Section 2: Advanced Filters — the ONE grouped condition builder
             (owner 1B-2). The old standalone "Player" section is gone; Role /
             Batting hand / Bowling style / R. Pos. now live here as condition
             types alongside Team, Match, and the numeric metric conditions.
             Mounted by src/drawer.js's mountFilterDrawer into #popup-advanced-host. -->
        <section class="filters-popup__section">
          <div class="filters-popup__section-header">
            <span class="filters-popup__section-name">Advanced Filters</span>
            <button type="button" class="filters-popup__chevron" data-role="fpop-section-toggle" aria-expanded="true" aria-controls="fpop-body-advanced" aria-label="Show or hide Advanced Filters"><span aria-hidden="true">▾</span></button>
          </div>
          <div class="filters-popup__section-body" id="fpop-body-advanced">
            <div id="popup-advanced-host"></div>
          </div>
        </section>

        <!-- Section 3: Columns (columns-rejig W1) — the leaderboard's column
             picker, RELOCATED here from its old toolbar pop-over. table.js mounts
             the SAME shared columnsPicker (createColumnsPicker → mountInline) into
             the host below; ticking/unticking a column applies INSTANTLY (frozen-
             scope requery, no Search). The toolbar "Columns" button is now a
             shortcut that opens this popup with THIS section expanded (main.js's
             onOpenColumns); the Filters button opens it with the two filter
             sections expanded / Columns collapsed. Defaults collapsed so a plain
             open lands on the familiar filters-first layout. Numbers untouched. -->
        <section class="filters-popup__section">
          <div class="filters-popup__section-header">
            <span class="filters-popup__section-name">Columns</span>
            <button type="button" class="filters-popup__chevron" data-role="fpop-section-toggle" aria-expanded="false" aria-controls="fpop-body-columns" aria-label="Show or hide Columns"><span aria-hidden="true">▾</span></button>
          </div>
          <div class="filters-popup__section-body" id="fpop-body-columns" hidden>
            <div id="fpop-columns-host"></div>
          </div>
        </section>
      </div>

      <!-- "This will come back empty" notice. A pick that the rest of your filters
           have made impossible is kept and greyed rather than reset (owner ruling),
           so the search can legitimately return nothing; when a whole filter's
           selection is impossible, drawer.js says so here in plain English. It
           INFORMS ONLY — Search is never disabled. Sits between the scrolling body
           and the footer so it is on screen whatever you have scrolled to. -->
      <div class="filters-popup__notice" data-role="fpop-notice" role="status" hidden>
        <p class="filters-popup__notice-main" data-role="fpop-notice-main"></p>
        <p class="filters-popup__notice-hint" data-role="fpop-notice-hint"></p>
      </div>

      <div class="filters-popup__footer">
        <label class="fpop-keep-columns" data-role="fpop-keep-columns-label">
          <input type="checkbox" data-role="fpop-keep-columns" />
          Keep Selected Columns
        </label>
        <button type="button" class="btn btn--primary" data-role="fpop-search">Search</button>
      </div>
    </div>
  </div>

  <div class="app">
    <header class="app-header">
      <div class="app-header__brand">
        <h1 class="app-header__title"><span class="app-header__wordmark">cricdb</span></h1>
      </div>
      <div class="app-header__controls">
        <!-- Header search (task 3a, owner decision 46): a compact player
             search visible on BOTH Stats and Graphs (this element is never
             toggled hidden by the view switch) — the same omnisearch
             component as the table-search box below, mounted separately in
             main.js so picking a player here always opens their popup. -->
        <div class="header-search" id="header-search-section">
          <svg class="header-search__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
          </svg>
          <input
            type="text"
            id="header-search-input"
            class="input header-search__input"
            placeholder="Search players…"
            aria-label="Search players"
            autocomplete="off"
            role="combobox"
            aria-expanded="false"
            aria-controls="header-search-results"
            aria-autocomplete="list"
          />
          <div
            class="omnisearch__results"
            id="header-search-results"
            role="listbox"
            aria-label="Player search results"
            hidden
          ></div>
        </div>
        <div class="segmented" data-role="view" role="group" aria-label="View">
          <button type="button" class="segmented__btn is-active" data-value="table">Stats</button>
          <button type="button" class="segmented__btn" data-value="graph">Graphs</button>
        </div>
      </div>
    </header>

    <main class="app-main">
      <div id="init-status" class="init-status" role="status" aria-live="polite"></div>

      <div id="app-content" class="app-content" hidden>
        <!-- Scope strip removed (F1a) — all filters now live in the Filters
             popup above. The Discipline toggle + #filter-bar moved into that
             popup's Conditions section. R3 Wave 4: the header's scope-sentence
             subtitle is gone too (owner: header is a single row, wordmark +
             search + view toggle only) — the Filters button's badge count is
             now the only always-visible scope indicator.
             F2: the applied-filter pills row and the table-search box (former
             #pills-bar / #player-search-section, static siblings here) both
             moved INSIDE #table-area's own results toolbar — table.js's
             ensureSkeleton() builds a pills host between the toolbar and the
             column headers, and a compact search input in the toolbar's left
             cluster next to the new Filters button, the first time a Search
             actually runs. Neither exists as a static element here any more. -->
        <section class="table-section" id="table-area" aria-label="Player stats table"></section>

        <section class="graph-section" id="graph-area" aria-label="Graphs" hidden></section>
      </div>
    </main>

    <footer class="app-footer">
      <span id="footer-data-date"></span>
    </footer>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
